services:
  - type: web
    name: asd-intervention-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asd-intervention-db
          property: connectionString
      # NOTE: Redis free tier not available on Render. Set REDIS_URL to Upstash free tier
      # URL for full cache functionality (e.g. rediss://:<token>@<host>:6379).
      # With localhost Redis, the API will function but cache misses will reload from DB.
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@thesis.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ENVIRONMENT
        value: production

databases:
  - name: asd-intervention-db
    plan: free
    databaseName: asd_intervention
    user: postgres
