[project]
name = "backend"
version = "0.1.0"
description = "ASD Intervention API Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.3.0",
    "numpy>=1.26.0",
    "dvc>=3.66.1",
    "tensorboard>=2.20.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "crewai[anthropic]>=1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
analysis = [
    "pandas>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["app*"]
